<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 黃家行事曆</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Helvetica Neue',sans-serif;background:#f5f5f3;color:#1a1a1a;padding:24px 16px;min-height:100vh}
.container{max-width:860px;margin:0 auto}
h1{font-size:20px;font-weight:500;margin-bottom:20px;color:#1a1a1a}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.view-toggle{display:flex;gap:8px}
.view-btn{font-size:14px;font-weight:500;padding:8px 18px;border-radius:12px;border:2px solid #ccc;background:#f0f0ee;color:#888;cursor:pointer;transition:all .2s}
.view-btn.on{border-color:#185FA5;background:#185FA5;color:#fff;box-shadow:0 3px 10px rgba(24,95,165,.2)}
.cloud-sync-area{display:flex;gap:8px;align-items:center}
.sync-btn{font-size:14px;font-weight:500;padding:8px 16px;border-radius:12px;border:none;background:#28a745;color:#fff;cursor:pointer;transition:background .2s;box-shadow:0 3px 10px rgba(40,167,69,.2)}
.sync-btn:hover{background:#218838}
.sync-btn:disabled{background:#6c757d;cursor:not-allowed;box-shadow:none}
.load-btn{background:#17a2b8;box-shadow:0 3px 10px rgba(23,162,184,.2)}
.load-btn:hover{background:#138496}
.filter-bar{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;padding-bottom:4px}
.filter-btn{font-size:14px;font-weight:500;padding:6px 14px;border-radius:20px;border:1px solid #e0e0e0;background:#fff;color:#666;cursor:pointer;white-space:nowrap;transition:all .15s}
.filter-btn.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.calendar-view{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,.04);display:none}
.calendar-view.active{display:block}
.month-header{font-size:16px;font-weight:600;margin:16px 0 12px;color:#333;display:flex;align-items:center;gap:6px}
.month-header::before{content:'';display:inline-block;width:4px;height:16px;background:#185FA5;border-radius:2px}
.grid-header{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;color:#999;font-weight:500;margin-bottom:8px}
.grid-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day-cell{background:#fafafa;border-radius:8px;aspect-ratio:1;padding:4px;display:flex;flex-direction:column;justify-content:space-between;position:relative;border:1px solid transparent;transition:background .15s}
.day-cell.other-month{opacity:.2;pointer-events:none}
.day-cell.today{background:#fff;border-color:#185FA5}
.day-num{font-size:12px;font-weight:600;color:#666}
.day-cell.today .day-num{color:#185FA5}
.day-cell.weekend .day-num{color:#d9534f}
.cell-dots{display:flex;flex-direction:column;gap:2px;overflow:hidden;max-height:calc(100% - 16px);margin-top:2px}
.cell-dot-text{font-size:9px;line-height:1.2;padding:1px 3px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;color:#fff}
.cell-dot-text.tag-all{background:#7c5295}
.cell-dot-text.tag-ding{background:#2a71b4}
.cell-dot-text.tag-duo{background:#e26d5c}
.cell-dot-text.tag-ke{background:#60b171}
.day-action-btn{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:4px;background:rgba(0,0,0,.05);border:none;color:#555;font-size:9px;cursor:pointer;display:none;align-items:center;justify-content:center;font-weight:bold}
.day-cell:hover .day-action-btn{display:flex}
.list-view{display:none;flex-direction:column;gap:12px}
.list-view.active{display:flex}
.list-card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,.04);display:flex;flex-direction:column;gap:12px;border-left:5px solid #ccc;transition:transform .15s}
.list-card:hover{transform:translateY(-1px)}
.list-card.tag-all{border-left-color:#7c5295}
.list-card.tag-ding{border-left-color:#2a71b4}
.list-card.tag-duo{border-left-color:#e26d5c}
.list-card.tag-ke{border-left-color:#60b171}
.card-top{display:flex;justify-content:space-between;align-items:flex-start}
.card-date-info{display:flex;flex-direction:column;gap:2px}
.card-date{font-size:16px;font-weight:600;color:#1a1a1a}
.card-w{font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;color:#fff;display:inline-block;align-self:flex-start}
.card-w.tag-all{background:#7c5295}
.card-w.tag-ding{background:#2a71b4}
.card-w.tag-duo{background:#e26d5c}
.card-w.tag-ke{background:#60b171}
.card-actions{display:flex;gap:12px;font-size:13px;color:#888}
.card-btn{cursor:pointer;user-select:none;transition:color .15s}
.card-btn:hover{color:#1a1a1a}
.card-btn.del:hover{color:#d9534f}
.card-main{display:flex;flex-direction:column;gap:6px}
.card-ev{font-size:15px;font-weight:500;color:#1a1a1a}
.card-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13px;color:#666}
.meta-item{display:flex;align-items:center;gap:4px}
.meta-label{color:#999;font-weight:normal;flex-shrink:0}
.card-note{font-size:12px;color:#888;background:#f8f8f6;padding:8px 12px;border-radius:8px;margin-top:2px;line-height:1.4;word-break:break-all}
.add-trigger-btn{position:fixed;bottom:24px;right:24px;width:54px;height:54px;border-radius:50%;background:#1a1a1a;color:#fff;border:none;font-size:24px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;transition:transform .2s,background .2s;z-index:90}
.add-trigger-btn:hover{transform:scale(1.05);background:#333}
.modal-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal-box{background:#fff;border-radius:20px;width:100%;max-width:400px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.1);display:flex;flex-direction:column;gap:16px;animation:modalIn .2s ease-out}
@keyframes modalIn{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-title{font-size:16px;font-weight:600;color:#1a1a1a}
.form-item{display:flex;flex-direction:column;gap:6px}
.form-label{font-size:12px;font-weight:500;color:#666}
.form-input,.form-select,.form-textarea{width:100%;font-size:14px;padding:10px 12px;border-radius:10px;border:1px solid #e0e0e0;background:#fafafa;color:#1a1a1a;outline:none;transition:all .15s}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:#1a1a1a;background:#fff}
.form-textarea{resize:none;height:64px}
.modal-btns{display:flex;gap:10px;margin-top:8px}
.modal-btn{flex:1;font-size:14px;font-weight:500;padding:12px;border-radius:10px;border:none;cursor:pointer;text-align:center;transition:all .15s}
.modal-btn.cancel{background:#f0f0ee;color:#666}
.modal-btn.cancel:hover{background:#e5e5e2}
.modal-btn.confirm{background:#1a1a1a;color:#fff}
.modal-btn.confirm:hover{background:#333}
.modal-btn.danger{background:#d9534f;color:#fff}
.modal-btn.danger:hover{background:#c9302c}
</style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <h1>2026 黃家行事曆</h1>
    <div class="cloud-sync-area">
      <button class="sync-btn load-btn" id="load-spreadsheet-btn" onclick="loadFromGoogleSheets()">從雲端下載</button>
      <button class="sync-btn" id="sync-spreadsheet-btn" onclick="saveToGoogleSheets()">同步至試算表</button>
    </div>
    <div class="view-toggle">
      <button id="vbtn-cal" class="view-btn on" onclick="setView('cal')">月曆</button>
      <button id="vbtn-list" class="view-btn" onclick="setView('list')">列表</button>
    </div>
  </div>
  <div class="filter-bar" id="filter-bar"></div>
  <div id="view-cal" class="calendar-view active"></div>
  <div id="view-list" class="list-view"></div>
</div>
<button class="add-trigger-btn" onclick="openAddModal()">+</button>
<div id="modal-container"></div>

<script>

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwR_xQyG6P3nK9jK_l5fVn9lYF
