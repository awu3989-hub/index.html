<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>2026 黃家行事曆</title>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:#f5f5f5;
  margin:0;
  padding:20px;
  color:#222;
}

.container{
  max-width:700px;
  margin:auto;
}

h1{
  font-size:28px;
  margin-bottom:20px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

button{
  border:none;
  border-radius:10px;
  padding:10px 16px;
  cursor:pointer;
  font-size:14px;
}

.primary{
  background:#2563eb;
  color:white;
}

.card-row{
  display:flex;
  gap:12px;
  margin-bottom:18px;
}

.card{
  background:white;
  padding:16px;
  border-radius:14px;
  flex:1;
  text-align:center;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.filters{
  display:flex;
  gap:10px;
  margin-bottom:24px;
  flex-wrap:wrap;
}

.chip{
  padding:8px 14px;
  border-radius:999px;
  background:white;
  border:1px solid #ddd;
  cursor:pointer;
}

.month{
  margin-bottom:36px;
}

.month h2{
  margin-bottom:12px;
}

.table{
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.row{
  display:grid;
  grid-template-columns:90px 70px 1fr;
  padding:12px 16px;
  border-bottom:1px solid #eee;
}

.row:last-child{
  border-bottom:none;
}

.date{
  font-weight:700;
}

.event{
  line-height:1.7;
}

.badge{
  display:inline-block;
  padding:2px 10px;
  border-radius:999px;
  font-size:12px;
  margin-right:6px;
}

.ting{
  background:#dbeafe;
  color:#1d4ed8;
}

.abo{
  background:#fde68a;
  color:#92400e;
}

.keke{
  background:#d9f99d;
  color:#3f6212;
}

.all{
  background:#e9d5ff;
  color:#6b21a8;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-box{
  background:white;
  width:90%;
  max-width:420px;
  border-radius:16px;
  padding:24px;
}

.modal-box input,
.modal-box textarea,
.modal-box select{
  width:100%;
  margin-bottom:14px;
  padding:10px;
  border-radius:10px;
  border:1px solid #ddd;
  box-sizing:border-box;
}

.toast{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#111;
  color:white;
  padding:12px 18px;
  border-radius:10px;
  display:none;
}

.small{
  color:#666;
  font-size:13px;
}
</style>
</head>

<body>

<div class="container">

<h1>2026 黃家行事曆</h1>

<div class="topbar">
<div id="syncText" class="small">連線中...</div>
<button class="primary" onclick="openModal()">
+ 新增行程
</button>
</div>

<div class="card-row">
<div class="card">
<div class="small">總天數</div>
<div id="totalDays">100</div>
</div>

<div class="card">
<div class="small">有行程</div>
<div id="hasEvent">0</div>
</div>

<div class="card">
<div class="small">無行程</div>
<div id="noEvent">0</div>
</div>
</div>

<div class="filters">
<div class="chip">全部行程</div>
<div class="chip">丁哥</div>
<div class="chip">阿多</div>
<div class="chip">可可</div>
<div class="chip">全家</div>
</div>

<div id="calendar"></div>

</div>

<div class="modal" id="modal">
<div class="modal-box">

<h3>新增行程</h3>

<input id="date" type="date">

<select id="member">
<option value="ting">丁哥</option>
<option value="abo">阿多</option>
<option value="keke">可可</option>
<option value="all">全家</option>
</select>

<input id="title" placeholder="行程名稱">

<textarea id="note" placeholder="備註"></textarea>

<button class="primary" onclick="saveEvent()">
儲存
</button>

</div>
</div>

<div class="toast" id="toast">
已同步到雲端
</div>

<script>

const API_URL =
'https://script.google.com/macros/s/AKfycbxOuBY64BC-0ZNTHndvywPukS0mkM6cdoeKwmByL3b0Fo9VSE-3lcuhC1uRaVK-9cyF/exec';

let events = [];

function openModal(){
  document.getElementById('modal').style.display='flex';
}

function closeModal(){
  document.getElementById('modal').style.display='none';
}

function toast(){
  const t=document.getElementById('toast');
  t.style.display='block';

  setTimeout(()=>{
    t.style.display='none';
  },2000);
}

function badgeClass(m){
  if(m==='ting') return 'ting';
  if(m==='abo') return 'abo';
  if(m==='keke') return 'keke';
  return 'all';
}

function memberName(m){
  if(m==='ting') return '丁哥';
  if(m==='abo') return '阿多';
  if(m==='keke') return '可可';
  return '全家';
}

function render(){

  const cal=document.getElementById('calendar');

  cal.innerHTML='';

  const grouped={};

  events.forEach(ev=>{

    const month=ev.date.slice(0,7);

    if(!grouped[month]) grouped[month]=[];

    grouped[month].push(ev);
  });

  Object.keys(grouped).forEach(month=>{

    const div=document.createElement('div');

    div.className='month';

    div.innerHTML=`
      <h2>${month.replace('-',' 年 ')} 月</h2>
      <div class="table">
        ${grouped[month].map(ev=>`
          <div class="row">
            <div class="date">${ev.date.slice(5)}</div>
            <div>${memberName(ev.member)}</div>
            <div class="event">
              <span class="badge ${badgeClass(ev.member)}">
                ${memberName(ev.member)}
              </span>
              ${ev.title}
              <div class="small">${ev.note||''}</div>
            </div>
          </div>
        `).join('')}
      </div>
    `;

    cal.appendChild(div);
  });

  const daySet=new Set(events.map(e=>e.date));

  document.getElementById('hasEvent').innerText=
    daySet.size;

  document.getElementById('noEvent').innerText=
    100-daySet.size;
}

function saveCloud(){

  fetch(API_URL,{
    method:'POST',
    headers:{
      'Content-Type':'application/x-www-form-urlencoded'
    },
    body:
      'data='+
      encodeURIComponent(
        JSON.stringify(events)
      )
  });

  toast();
}

function loadCloud(){

  const callbackName =
    'jsonp_' + Date.now();

  window[callbackName]=function(data){

    events=data||[];

    render();

    document.getElementById('syncText')
      .innerText='已連線';

    delete window[callbackName];
  };

  const script=document.createElement('script');

  script.src=
    API_URL+
    '?action=load&callback='+
    callbackName;

  document.body.appendChild(script);
}

function saveEvent(){

  const ev={
    date:document.getElementById('date').value,
    member:document.getElementById('member').value,
    title:document.getElementById('title').value,
    note:document.getElementById('note').value
  };

  events.push(ev);

  events.sort((a,b)=>
    a.date.localeCompare(b.date)
  );

  render();

  saveCloud();

  closeModal();
}

loadCloud();

</script>

</body>
</html>
