<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>100天家庭行事曆</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:"Noto Sans TC",sans-serif;
  background:#f5f7fb;
  color:#222;
}

header{
  background:#4f46e5;
  color:white;
  padding:18px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.container{
  max-width:1200px;
  margin:20px auto;
  padding:16px;
}

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

button{
  border:none;
  background:#4f46e5;
  color:white;
  padding:10px 16px;
  border-radius:10px;
  cursor:pointer;
  font-size:14px;
}

button:hover{
  opacity:.9;
}

.card{
  background:white;
  border-radius:16px;
  padding:16px;
  box-shadow:0 2px 12px rgba(0,0,0,.08);
  margin-bottom:18px;
}

.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:10px;
}

.day{
  background:#fff;
  border-radius:14px;
  min-height:140px;
  padding:10px;
  border:1px solid #e5e7eb;
}

.day-number{
  font-weight:bold;
  margin-bottom:8px;
  color:#4f46e5;
}

.event{
  background:#eef2ff;
  border-left:4px solid #4f46e5;
  padding:6px;
  border-radius:8px;
  margin-bottom:6px;
  font-size:12px;
}

.event-title{
  font-weight:bold;
}

.event-time{
  color:#666;
  margin-top:2px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:12px;
}

input,select,textarea{
  width:100%;
  padding:10px;
  border:1px solid #ccc;
  border-radius:10px;
}

textarea{
  resize:vertical;
}

.loading{
  text-align:center;
  padding:30px;
  color:#666;
}

.success{
  color:green;
  margin-top:10px;
}

.error{
  color:red;
  margin-top:10px;
}

@media(max-width:768px){
  .calendar-grid{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<header>
100天家庭行事曆
</header>

<div class="container">

  <div class="toolbar">
    <button onclick="loadData()">重新整理</button>
    <button onclick="toggleForm()">新增行程</button>
  </div>

  <div class="card" id="formCard" style="display:none;">
    <h2 style="margin-bottom:16px;">新增行程</h2>

    <div class="form-grid">

      <div>
        <label>日期</label>
        <input type="date" id="date">
      </div>

      <div>
        <label>成員</label>
        <input type="text" id="who" placeholder="例如：爸爸">
      </div>

      <div>
        <label>類型</label>
        <input type="text" id="type" placeholder="例如：工作">
      </div>

      <div>
        <label>事件</label>
        <input type="text" id="event" placeholder="例如：開會">
      </div>

      <div>
        <label>時間</label>
        <input type="text" id="time" placeholder="例如：14:00">
      </div>

      <div>
        <label>地點</label>
        <input type="text" id="location">
      </div>

      <div>
        <label>對象</label>
        <input type="text" id="opponent">
      </div>

    </div>

    <div style="margin-top:12px;">
      <label>備註</label>
      <textarea id="note"></textarea>
    </div>

    <div style="margin-top:12px;">
      <label>月份備註</label>
      <textarea id="month_note"></textarea>
    </div>

    <div style="margin-top:16px;">
      <button onclick="saveEvent()">儲存行程</button>
    </div>

    <div id="msg"></div>

  </div>

  <div class="card">
    <div id="calendar" class="calendar-grid"></div>
  </div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwf7nC4LGzQlqJFFPL27uvG2Fjc9ChWHOlCRlHY-QWhcGijTtcfOMwJiSDJtt47pSzC/exec";

let calendarData = {
  extraEvs:{},
  overrideEvs:{},
  deletedIds:[]
};

function toggleForm(){
  const form = document.getElementById("formCard");

  form.style.display =
    form.style.display === "none"
      ? "block"
      : "none";
}

async function loadData(){

  document.getElementById("calendar").innerHTML =
    `<div class="loading">讀取中...</div>`;

  try{

    const res = await fetch(API_URL);

    const text = await res.text();

    calendarData = JSON.parse(text);

    renderCalendar();

  }catch(err){

    document.getElementById("calendar").innerHTML =
      `<div class="error">讀取失敗</div>`;

    console.error(err);
  }
}

function renderCalendar(){

  const calendar = document.getElementById("calendar");

  calendar.innerHTML = "";

  const events = calendarData.extraEvs || {};

  const allDates = Object.keys(events).sort();

  if(allDates.length === 0){

    calendar.innerHTML =
      `<div class="loading">目前沒有行程</div>`;

    return;
  }

  allDates.forEach(date=>{

    const dayDiv = document.createElement("div");

    dayDiv.className = "day";

    const evs = events[date];

    let html = `
      <div class="day-number">${date}</div>
    `;

    evs.forEach(ev=>{

      html += `
        <div class="event">
          <div class="event-title">
            ${ev.event || ""}
          </div>

          <div>
            ${ev.who || ""}
            ${ev.type ? "｜"+ev.type : ""}
          </div>

          <div class="event-time">
            ${ev.time || ""}
          </div>

          <div>
            ${ev.location || ""}
          </div>

          <div>
            ${ev.note || ""}
          </div>
        </div>
      `;
    });

    dayDiv.innerHTML = html;

    calendar.appendChild(dayDiv);

  });

}

async function saveEvent(){

  const data = {
    extraEvs:{...calendarData.extraEvs},
    overrideEvs:calendarData.overrideEvs || {},
    deletedIds:calendarData.deletedIds || []
  };

  const eventData = {
    id: Date.now(),

    date:
      document.getElementById("date").value,

    who:
      document.getElementById("who").value,

    type:
      document.getElementById("type").value,

    event:
      document.getElementById("event").value,

    time:
      document.getElementById("time").value,

    location:
      document.getElementById("location").value,

    opponent:
      document.getElementById("opponent").value,

    note:
      document.getElementById("note").value,

    month_note:
      document.getElementById("month_note").value
  };

  if(!eventData.date){

    showMsg("請輸入日期",true);

    return;
  }

  if(!data.extraEvs[eventData.date]){

    data.extraEvs[eventData.date] = [];
  }

  data.extraEvs[eventData.date].push(eventData);

  try{

    await fetch(API_URL,{
      method:"POST",
      body:JSON.stringify(data)
    });

    showMsg("儲存成功");

    calendarData = data;

    renderCalendar();

  }catch(err){

    showMsg("儲存失敗",true);

    console.error(err);
  }
}

function showMsg(text,isError=false){

  const msg = document.getElementById("msg");

  msg.className =
    isError ? "error" : "success";

  msg.innerText = text;

  setTimeout(()=>{
    msg.innerText = "";
  },3000);
}

loadData();

</script>

</body>
</html>
