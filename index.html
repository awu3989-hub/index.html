<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 Huang Family Calendar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Helvetica Neue',sans-serif;background:#f5f5f3;color:#1a1a1a;padding:24px 16px;min-height:100vh}
.container{max-width:860px;margin:0 auto}
h1{font-size:20px;font-weight:500;margin-bottom:20px;color:#1a1a1a}
.stats{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.stat{background:#fff;border-radius:8px;padding:10px 20px;text-align:center;min-width:80px;border:0.5px solid #e0e0da}
.stat-label{font-size:12px;color:#888;margin-bottom:4px}
.stat-num{font-size:26px;font-weight:500;color:#1a1a1a}
.filter-section{margin-bottom:20px}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.fbtn{font-size:13px;padding:5px 16px;border-radius:20px;border:0.5px solid #ccc;background:transparent;color:#1a1a1a;cursor:pointer}
.fbtn.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.fbtn-d.on{background:#B5D4F4;color:#0C447C;border-color:#85B7EB}
.fbtn-a.on{background:#FAC775;color:#633806;border-color:#EF9F27}
.fbtn-c.on{background:#C0DD97;color:#27500A;border-color:#97C459}
.fbtn-f.on{background:#EEEDFE;color:#3C3489;border-color:#AFA9EC}
.month-block{margin-bottom:2rem}
.month-title{font-size:16px;font-weight:500;color:#1a1a1a;margin:18px 0 8px;padding-bottom:6px;border-bottom:0.5px solid #ddd}
table{width:100%;border-collapse:collapse;table-layout:fixed;background:#fff;border-radius:8px;overflow:hidden;border:0.5px solid #e0e0da}
col.c-date{width:58px}col.c-dow{width:52px}col.c-ev{width:auto}col.c-plan{width:130px}
th{font-size:12px;color:#888;font-weight:400;padding:6px 10px;border-bottom:0.5px solid #e0e0da;text-align:left;background:#fafaf8}
td{padding:9px 10px;border-bottom:0.5px solid #f0f0ec;vertical-align:top;font-size:13px;word-break:break-word;line-height:1.55}
tr:last-child td{border-bottom:none}
.date-cell{font-weight:500;color:#1a1a1a;white-space:nowrap}
.dow-cell{color:#888;white-space:nowrap}
.sun .date-cell,.sun .dow-cell{color:#d94f4f}
.sat .date-cell,.sat .dow-cell{color:#2a6db5}
.muted{color:#aaa}
.tag{display:inline-block;font-size:11px;font-weight:500;padding:1px 7px;border-radius:20px;white-space:nowrap}
.td{background:#B5D4F4;color:#0C447C}
.ta{background:#FAC775;color:#633806}
.tc{background:#C0DD97;color:#27500A}
.tf{background:#EEEDFE;color:#3C3489}
.ev-line{margin-bottom:6px;line-height:1.5}
.ev-line:last-child{margin-bottom:0}
.ev-title{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.ev-name{color:#1a1a1a;font-size:13px}
.ev-meta{font-size:11px;color:#888;margin-top:2px;padding-left:2px;line-height:1.6}
.plan-cell{font-size:12px;color:#aaa;vertical-align:top;line-height:1.6}
@media(max-width:600px){col.c-plan{width:80px}col.c-date{width:48px}col.c-dow{width:44px}th,td{padding:7px 6px}}
</style>
</head>
<body>
<div class="container">
<h1>2026 黃家行事曆</h1>
<div class="stats">
  <div class="stat"><div class="stat-label">總天數</div><div class="stat-num">100</div></div>
  <div class="stat"><div class="stat-label">有行程</div><div class="stat-num" id="shas">0</div></div>
  <div class="stat"><div class="stat-label">無行程</div><div class="stat-num" id="snone">0</div></div>
</div>
<div class="filter-section">
  <div class="filter-row">
    <button class="fbtn on" onclick="setFilter('schedule','all',this)">全部日期</button>
    <button class="fbtn" onclick="setFilter('schedule','has',this)">有行程</button>
    <button class="fbtn" onclick="setFilter('schedule','none',this)">無行程</button>
    <button class="fbtn fbtn-d" onclick="setFilter('who','d',this)">丁哥</button>
    <button class="fbtn fbtn-a" onclick="setFilter('who','a',this)">阿多</button>
    <button class="fbtn fbtn-c" onclick="setFilter('who','c',this)">可可</button>
    <button class="fbtn fbtn-f" onclick="setFilter('who','f',this)">全家</button>
  </div>
</div>
<div id="cal"></div>
</div>
<script>
const DOW=['日','一','二','三','四','五','六'];
function pad(n){return String(n).padStart(2,'0')}
function dk(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function tclass(w){return w==='d'?'td':w==='a'?'ta':w==='c'?'tc':'tf'}
function tlabel(w){return w==='d'?'丁哥':w==='a'?'阿多':w==='c'?'可可':'全家'}
function sortKey(t){if(!t)return 9999;const m=t.match(/(\d{1,2}):(\d{2})/);return m?parseInt(m[1])*100+parseInt(m[2]):9999;}

const FIX={
  '2026-05-24':[
    {w:'d',time:'14:00',loc:'華僑高中',ev:'小學生足球賽預賽',note:'vs 榮富國小'},
    {w:'a',time:'12:00',loc:'華僑高中',ev:'小學生足球賽預賽',note:'vs 新市國小'},
    {w:'a',time:'14:00',loc:'華僑高中',ev:'小學生足球賽預賽',note:'vs 自強國小'},
  ],
  '2026-05-26':[{w:'d',time:'',loc:'',ev:'期末考'}],
  '2026-05-30':[
    {w:'d',time:'10:00',loc:'華僑高中',ev:'小學生足球賽預賽',note:'vs 崇德國小'},
    {w:'d',time:'14:00',loc:'華僑高中',ev:'小學生足球賽預賽',note:'vs A2'},
    {w:'a',time:'12:00',loc:'華僑高中',ev:'小學生足球賽預賽',note:'vs 海山國小'},
  ],
  '2026-06-12':[{w:'d',time:'',loc:'',ev:'國小畢業典禮'}],
  '2026-06-17':[{w:'a',time:'',loc:'',ev:'期末考'}],
  '2026-06-19':[
    {w:'d',time:'',loc:'新莊田徑場',ev:'包中盃五人制足球賽'},
    {w:'a',time:'',loc:'新莊田徑場',ev:'包中盃五人制足球賽'},
  ],
  '2026-06-20':[
    {w:'d',time:'',loc:'新莊田徑場',ev:'包中盃五人制足球賽'},
    {w:'a',time:'',loc:'新莊田徑場',ev:'包中盃五人制足球賽'},
  ],
  '2026-06-21':[
    {w:'d',time:'',loc:'新莊田徑場',ev:'包中盃五人制足球賽'},
    {w:'a',time:'',loc:'新莊田徑場',ev:'包中盃五人制足球賽'},
  ],
  '2026-06-27':[{w:'a',time:'',loc:'台中朝馬足球場',ev:'小學生足球賽決賽'}],
};

function practiceAMPM(w,loc){
  return {w,time:'09:00',type:'group',ev:'暑期練球（上午／下午）',lines:[{loc,time:'09:00–11:00'},{loc,time:'14:00–17:00'}]};
}
function practicePM(w,loc){
  return {w,time:'14:00',type:'group',ev:'暑期練球（下午）',lines:[{loc,time:'14:00–17:00'}]};
}

function getEvs(dt){
  const k=dk(dt),y=dt.getFullYear(),m=dt.getMonth()+1,d=dt.getDate();
  const ev=FIX[k]?[...FIX[k]]:[];
  if(y===2026&&m===8&&d>=9&&d<=11) ev.push({w:'f',time:'',loc:'溪頭',ev:'家庭旅行'});
  if((y===2026&&m===6&&d>=28)||(y===2026&&m===7&&d<=5)) ev.push({w:'a',time:'',loc:'台中朝馬足球場',ev:'小學生足球賽決賽'});
  if(y===2026&&m===7&&d===6) ev.push({w:'a',time:'',loc:'台中朝馬足球場',ev:'小學生足球賽決賽'});
  if((y===2026&&m===7&&d===6)||(y===2026&&m===7&&d>=7&&d<=10)) ev.push(practiceAMPM('a','蘆洲國小'));
  if(y===2026&&m===7&&d>=13&&d<=23) ev.push(practicePM('a','蘆洲國小'));
  if(y===2026&&m===7&&d>=16&&d<=21) ev.push({w:'d',time:'',loc:'廣州番禺區',ev:'台港澳足球聯賽'});
  if(y===2026&&m===7&&d>=27&&d<=31) ev.push(practiceAMPM('a','蘆洲國小'));
  if(y===2026&&m===8&&d>=3&&d<=21) ev.push(practiceAMPM('a','蘆洲國小'));
  ev.sort((a,b)=>sortKey(a.time)-sortKey(b.time));
  return ev;
}

const start=new Date(2026,4,24),end=new Date(2026,7,31);
const allDays=[];
for(let c=new Date(start);c<=end;c.setDate(c.getDate()+1))
  allDays.push({d:new Date(c),evs:getEvs(new Date(c))});

const hasC=allDays.filter(r=>r.evs.length>0).length;
document.getElementById('shas').textContent=hasC;
document.getElementById('snone').textContent=allDays.length-hasC;

const MN={'05':'2026年 5月','06':'2026年 6月','07':'2026年 7月','08':'2026年 8月'};
const months={};
allDays.forEach(r=>{const mk=pad(r.d.getMonth()+1);if(!months[mk])months[mk]=[];months[mk].push(r);});

function renderEv(e){
  const tag=`<span class="tag ${tclass(e.w)}" style="font-size:11px;padding:1px 6px">${tlabel(e.w)}</span>`;
  if(e.type==='group'){
    const metaLines=e.lines.map(l=>`${l.loc}・${l.time}`).join('<br>');
    return `<div class="ev-line" data-who="${e.w}"><div class="ev-title">${tag}<span class="ev-name">${e.ev}</span></div><div class="ev-meta">${metaLines}</div></div>`;
  }
  const meta=[e.loc,e.time].filter(x=>x).join('・');
  const noteStr=e.note?`<br>${e.note}`:'';
  return `<div class="ev-line" data-who="${e.w}"><div class="ev-title">${tag}<span class="ev-name">${e.ev}</span></div>${meta||noteStr?`<div class="ev-meta">${meta}${noteStr}</div>`:''}</div>`;
}

let activeSchedule='all';
let activeWho='';

function setFilter(type,val,btn){
  if(type==='schedule'){activeSchedule=val;activeWho='';}
  else{activeWho=val;activeSchedule='all';}
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  applyFilter();
}

function applyFilter(){
  document.querySelectorAll('tr[data-has]').forEach(tr=>{
    const h=tr.dataset.has==='1';
    const whoList=tr.dataset.who?tr.dataset.who.split(','):[];
    let show=true;
    if(activeWho){
      show=whoList.includes(activeWho);
      tr.querySelectorAll('.ev-line[data-who]').forEach(el=>{el.style.display=el.dataset.who===activeWho?'':'none';});
    } else {
      tr.querySelectorAll('.ev-line[data-who]').forEach(el=>el.style.display='');
      if(activeSchedule==='has') show=h;
      else if(activeSchedule==='none') show=!h;
    }
    tr.style.display=show?'':'none';
  });
  document.querySelectorAll('.month-block').forEach(mb=>{
    const vis=[...mb.querySelectorAll('tr[data-has]')].some(r=>r.style.display!=='none');
    mb.style.display=vis?'':'none';
  });
}

function buildCal(){
  let html='';
  for(const mk of Object.keys(months)){
    const isJulAug=mk==='07'||mk==='08';
    html+=`<div class="month-block"><div class="month-title">${MN[mk]}</div>
    <table><colgroup><col class="c-date"><col class="c-dow"><col class="c-ev"><col class="c-plan"></colgroup>
    <thead><tr><th>日期</th><th>星期</th><th>事件</th><th>計劃／備註</th></tr></thead><tbody>`;
    for(const {d,evs} of months[mk]){
      const dow=d.getDay();
      const cls=dow===0?'sun':dow===6?'sat':'';
      const hasEv=evs.length>0;
      if(!isJulAug&&!hasEv) continue;
      const evHtml=hasEv?evs.map(renderEv).join(''):'<span class="muted">—</span>';
      const whoList=[...new Set(evs.map(e=>e.w))].join(',');
      html+=`<tr class="${cls}" data-has="${hasEv?1:0}" data-who="${whoList}">
        <td class="date-cell">${pad(d.getMonth()+1)}/${pad(d.getDate())}</td>
        <td class="dow-cell">週${DOW[dow]}</td>
        <td>${evHtml}</td>
        <td class="plan-cell"></td>
      </tr>`;
    }
    html+=`</tbody></table></div>`;
  }
  document.getElementById('cal').innerHTML=html;
  applyFilter();
}
buildCal();
</script>
</body>
</html>
